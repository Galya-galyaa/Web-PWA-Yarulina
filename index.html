<!DOCTYPE html>

    <title>Калькулятор ИМТ</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

            <img src="images/icon.png" alt="logo" height="50" width="50">

        <div class="input-div">
            <button>Посчитать ИМТ</button>
        </div>

    <script src="app.js"></script>
